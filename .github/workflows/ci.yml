name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile modules
        run: python -m compileall -q app scripts
      - name: Check critical Python lint
        run: ruff check app tests scripts --select E4,E7,E9,F
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Docker image builds
        run: docker build -t document-intelligence-platform:ci .

  container-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke-test client
        run: python -m pip install 'httpx>=0.27.0' 'pypdf>=6.1.0,<7.0.0'
      - name: Build and start API with PostgreSQL
        run: docker compose up --build --detach --wait
      - name: Exercise upload, persistence, retrieval, and cited Q&A
        run: python scripts/smoke_test.py --document-id-output /tmp/document-id
      - name: Prove vectors and citations survive an API restart
        run: |
          docker compose restart api
          docker compose up --detach --wait
          python scripts/smoke_test.py --verify-document-id-file /tmp/document-id
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
